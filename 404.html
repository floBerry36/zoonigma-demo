<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page introuvable — Zoonigma</title>
<link rel="icon" href="https://floberry36.github.io/zoonigma-demo/favicon.svg" type="image/svg+xml">
<style>
	:root { color-scheme: light dark; --paper: #fbf5e9; --ink: #1d2a24; --brand: #1e5a44; --on-brand: #ffffff; }
	@media (prefers-color-scheme: dark) { :root { --paper: #121d18; --ink: #f1ebdd; --brand: #5fb38a; --on-brand: #121d18; } }
	body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, sans-serif; }
	main { max-width: 30rem; margin: 12vh auto 0; padding: 0 1rem; text-align: center; }
	img { width: 250px; max-width: 100%; height: auto; }
	h1 { font-size: 1.5rem; margin: 1.5rem 0 0.25rem; }
	p { margin: 0 0 1.5rem; }
	a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 1.25rem; border-radius: 12px;
		background: var(--brand); color: var(--on-brand); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
	<picture>
		<source srcset="https://floberry36.github.io/zoonigma-demo/logos/logo-sombre.svg" media="(prefers-color-scheme: dark)">
		<img src="https://floberry36.github.io/zoonigma-demo/logos/logo.svg" alt="Zoonigma" width="250" height="65">
	</picture>
	<h1>Cette page n'existe pas</h1>
	<p><a href="https://floberry36.github.io/zoonigma-demo/fr/">Retour à l'accueil</a></p>
	<h1 lang="en">This page does not exist</h1>
	<p lang="en"><a href="https://floberry36.github.io/zoonigma-demo/en/">Back to home</a></p>
</main>
</body>
</html>
